.show{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.show span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:99px;padding:3px 12px 3px 3px;font-size:12px}.show .med{width:22px;height:22px;font-size:10px}
.star:disabled{opacity:.25;cursor:default}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.sg div{background:rgba(255,255,255,.05);border-radius:14px;padding:12px}.sg b{display:block;font-size:19px;font-weight:600}.sg small{color:var(--mu);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.tbl td,.tbl th{padding:7px 6px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl th{color:var(--mu);font-weight:500}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}.heat i{width:11px;height:11px;border-radius:3px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.mdl{display:block;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.ach{grid-template-columns:auto 1fr auto!important}.ach.lkd .mdl{filter:none}.ach.lkd{opacity:.82}
.lvl{display:flex;align-items:center;gap:12px}
.show span{padding:2px 12px 2px 2px!important;font-size:12.5px!important;background:rgba(255,255,255,.04)}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}.bars div{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(var(--ac),var(--ac2));min-height:3px;opacity:.9}
.bl{display:flex;gap:3px;font-size:10px;color:var(--mu);margin-top:4px}.bl span{flex:1;text-align:center;white-space:nowrap;overflow:visible}
.sg div small:first-child{display:block}.sg div b{margin:2px 0}

<script>
const $=s=>document.querySelector(s);
let ACCL=[{id:'main',name:'Me'}],ACC='main';
try{const l=JSON.parse(localStorage.getItem('aurel:accs'));if(Array.isArray(l)&&l.length)ACCL=l;const a=localStorage.getItem('aurel:acc');ACC=ACCL.some(x=>x.id===a)?a:ACCL[0].id}catch(e){}
const SK=ACC==='main'?'aurel':'aurel:'+ACC,fk=k=>ACC==='main'?k:ACC+'/'+k;
const D={ev:'3x3',cs:'s1',snd:{},bgi:'',insl:15,scr:0,amb:true,cfm:true,dec:2,hold:300,fs:100,col:'#eceef3',insp:false,live:true,fit:'cover',zoom:100,x:0,y:0,bri:100,con:100,sat:100,op:100,blur:0,ovc:'#000000',ovi:35,vaud:false,vspd:100,vol:60};
let S={set:{...D},times:[],pb:{},sess:[{id:'s1',name:'Session 1'}],bgs:[],alg:{st:{},fav:{},note:{},var:{},cus:[]},cats:['2x2','3x3','4x4','5x5'].map(n=>({id:n,name:n,type:n})),profile:{name:'',pron:'',status:'',bio:'',wca:'',accent:'#a9bcff',ban:0,bimg:'',av:''}};
try{const r=JSON.parse(localStorage.getItem(SK));if(r){S.set={...D,...r.set};S.times=r.times||[];S.pb=r.pb||{};S.sess=r.sess||S.sess;S.bgs=r.bgs||[];S.alg={...S.alg,...(r.alg||{})};if(Array.isArray(r.cats)&&r.cats.length)S.cats=r.cats;S.profile={...S.profile,...(r.profile||{})}}}catch(e){}
const save=()=>{try{stash();localStorage.setItem(SK,JSON.stringify(S))}catch(e){}try{cloudDirty()}catch(e){}try{achSoon()}catch(e){}};

/* ---------- file storage (IndexedDB) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('aurel-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbGet=async k=>{try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('f').objectStore('f').get(fk(k));q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()})}catch(e){}};
const dbSet=async(k,v)=>{try{const d=await idb();await new Promise(ok=>{const t=d.transaction('f','readwrite');v?t.objectStore('f').put(v,fk(k)):t.objectStore('f').delete(fk(k));t.oncomplete=ok;t.onerror=ok})}catch(e){}};

/* ---------- background ---------- */
let bgEl=null,bgUrl=null,sndUrl=null;
function setBg(b){
  $('#bgm').innerHTML='';if(bgUrl)URL.revokeObjectURL(bgUrl);bgEl=null;bgUrl=null;
  if(b){
    bgUrl=URL.createObjectURL(b);const v=b.type.startsWith('video');
    bgEl=document.createElement(v?'video':'img');bgEl.src=bgUrl;bgEl.draggable=false;bgEl.decoding='async';
    if(v){bgEl.loop=true;bgEl.muted=true;bgEl.autoplay=true;bgEl.controls=false;bgEl.disablePictureInPicture=true;bgEl.setAttribute('playsinline','')}
    if(!v){const a=bgEl.cloneNode();a.id='bga';a.setAttribute('aria-hidden','true');$('#bgm').append(a)}
    $('#bgm').append(bgEl);
  }
  applyBg();
}
function applyBg(){
  const s=S.set,m=$('#bgm');
  m.style.opacity=s.op/100;
  m.style.filter=`brightness(${s.bri}%) contrast(${s.con}%) saturate(${s.sat}%) blur(${s.blur}px)`;
  const o=$('#ov');o.style.background=s.ovc;o.style.opacity=s.ovi/100;$('#scrim').style.opacity=s.scr/100;
  if(!bgEl)return;
  const am=$('#bga');if(am)am.style.display=s.amb?'':'none';
  bgEl.style.objectFit={cover:'cover',contain:'contain',fill:'fill',none:'none'}[s.fit];
  bgEl.style.transform=`translate(${s.x}%,${s.y}%) scale(${s.zoom/100})`;
  if(bgEl.tagName==='VIDEO'){
    bgEl.playbackRate=s.vspd/100;bgEl.muted=!s.vaud;
    bgEl.play().catch(()=>{bgEl.muted=true;bgEl.play().catch(()=>{})});
  }
}
function applyStyle(){const r=document.documentElement.style;r.setProperty('--fs',S.set.fs/100);r.setProperty('--col',S.set.col)}

/* ---------- sound ---------- */
let ac;
function tone(f,d,v=S.set.vol/100){
  if(!v)return;
  try{ac=ac||new AudioContext();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.frequency.value=f;g.gain.setValueAtTime(v*.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}
function stopSound(){
  if(sndUrl&&S.set.vol){try{const a=new Audio(sndUrl);a.volume=S.set.vol/100;a.play().catch(()=>{})}catch(e){}}
  else tone(660,.14);
}

/* ---------- scramble & stats ---------- */
const EV={'2x2':{n:9,f:'RUF',w:0},'3x3':{n:20,f:'RLUDFB',w:0},'4x4':{n:40,f:'RLUDFB',w:1},'5x5':{n:60,f:'RLUDFB',w:1}};
let scr='';
function newScramble(){
  const e=EV[S.set.ev],ax={R:0,L:0,U:1,D:1,F:2,B:2};let o=[],last=-1;
  while(o.length<e.n){
    const f=e.f[Math.random()*e.f.length|0];if(ax[f]===last)continue;last=ax[f];
    o.push(f+(e.w&&Math.random()<.3?'w':'')+['','\'','2'][Math.random()*3|0]);
  }
  scr=o.join(' ');$('#scr').textContent=scr;
}
const val=t=>t.pen==='dnf'?Infinity:t.ms+(t.pen===2?2000:0);
const list=()=>S.times.filter(t=>t.ev===S.set.ev&&(t.sid||'s1')===S.set.cs);
function fmt(ms){
  if(ms==null)return'–';if(ms===Infinity)return'DNF';
  const d=S.set.dec,u=10**(3-d),s=Math.floor(ms/u)*u/1000;
  if(s>=60){const m=s/60|0;return m+':'+(s-m*60).toFixed(d).padStart(d+3,'0')}
  return s.toFixed(d);
}
const tf=t=>t.pen==='dnf'?'DNF':fmt(val(t))+(t.pen===2?'+':'');
function ao(a,n){
  if(a.length<n)return null;
  const w=a.slice(-n).map(val).sort((x,y)=>x-y).slice(1,-1);
  return w.includes(Infinity)?Infinity:w.reduce((p,c)=>p+c,0)/w.length;
}
function renderStats(){
  const a=list(),v=a.map(val).filter(isFinite);
  const best=v.length?Math.min(...v):null,mean=v.length?v.reduce((p,c)=>p+c,0)/v.length:null;
  $('#stats').innerHTML=[['Best',best],['Ao5',ao(a,5)],['Ao12',ao(a,12)],['Mean',mean],['Solves',a.length]].map(([l,x])=>`<div><small>${l}</small><b>${l==='Solves'?x:fmt(x)}</b></div>`).join('');
  document.body.dataset.l=(a.length||und.length)?1:0;
  if(a.length&&st==='idle')$('#time').textContent=tf(a[a.length-1]);
  if(!a.length&&st==='idle')$('#time').textContent=fmt(0);
}
function renderHist(){
  const a=list();
  $('#hl').innerHTML=a.length?a.slice().reverse().map((t,i)=>`<li data-i="${S.times.indexOf(t)}"><span class="n">${a.length-i}</span><b>${tf(t)}</b><span class="sc">${t.scr}</span><span class="ac"><button data-a="p2">+2</button><button data-a="dnf">DNF</button><button data-a="del" aria-label="Delete">×</button></span></li>`).join(''):'<p class="empty">No solves yet. Hold anywhere, release, and solve.</p>';
}
const refresh=()=>{save();renderStats();renderHist();renderT()};

/* ---------- timer ---------- */
let st='idle',T0=0,raf=0,holdT=0,inspT0=0,beeped={};
const setSt=s=>{st=s;document.body.dataset.s=s;
  $('#hint').textContent={idle:'Hold to get ready',hold:'Keep holding',ready:'Release to start',inspect:'Hold to start the solve',inspHold:'Keep holding',inspReady:'Release to start',running:''}[s]||'';
};
function loop(){
  const n=performance.now();
  if(st==='running')$('#time').textContent=S.set.live?fmt(n-T0):'···';
  else if(st.startsWith('insp')){
    const e=(n-inspT0)/1000;
    const L=S.set.insl;$('#time').textContent=e<L?Math.ceil(L-e):e<L+2?'+2':'DNF';
    if(e>=L-7&&!beeped[8]){beeped[8]=1;playEvt('insp')}
    if(e>=L-3&&!beeped[12]){beeped[12]=1;playEvt('insp');setTimeout(()=>playEvt('insp'),220)}
  }else return;
  raf=requestAnimationFrame(loop);
}
function onDown(e){
  const t=e.timeStamp;
  if(st==='running'){stop(t);return}
  if(document.querySelector('.sheet.on,.dlg.on')||document.body.classList.contains('adj'))return;
  if(st!=='idle'&&st!=='inspect')return;
  setSt(st==='idle'?'hold':'inspHold');
  const go=()=>{if(st==='hold')setSt('ready');else if(st==='inspHold')setSt('inspReady');else return;tone(880,.06)};
  clearTimeout(holdT);S.set.hold?holdT=setTimeout(go,S.set.hold):go();
}
function onUp(e){
  clearTimeout(holdT);
  if(st==='ready'){
    if(S.set.insp){inspT0=performance.now();beeped={};setSt('inspect');cancelAnimationFrame(raf);loop()}
    else start(e.timeStamp,null);
  }else if(st==='inspReady'){
    const el=(e.timeStamp-inspT0)/1000,L=S.set.insl;start(e.timeStamp,el>L+2?'dnf':el>L?2:null);
  }else if(st==='hold')setSt('idle');
  else if(st==='inspHold')setSt('inspect');
}
let curPen=null;
function start(ts,pen){curPen=pen;T0=ts;setSt('running');cancelAnimationFrame(raf);loop();playEvt('start')}
function stop(ts){
  const ms=Math.max(0,Math.round(ts-T0));
  cancelAnimationFrame(raf);setSt('idle');
  const L0=list(),pv0=L0.length?val(L0[L0.length-1]):null,sb=Math.min(...L0.map(val).filter(isFinite));
  und.push(JSON.stringify(S.times));const t={ms,pen:curPen,ev:S.set.ev,sid:S.set.cs,scr,d:Date.now()};S.times.push(t);
  const hit=checkPB(t,isFinite(sb)?sb:null,pv0!=null&&isFinite(pv0)?pv0:null)||(t.pen==='dnf'?'dnf':t.pen===2?'p2':null);
  playEvt('stop');if(hit)setTimeout(()=>playEvt(hit),350);newScramble();refresh();if(hit&&PBN[hit])flash(PBN[hit]);
}
function lastSolve(){const a=list();return a[a.length-1]}
function act(t,a){
  if(a==='undo'){if(und.length){restoreSnap(und.pop());toast('Undone')}else toast('Nothing to undo');return}if(!t)return;und.push(JSON.stringify(S.times));if(und.length>30)und.shift();
  if(a==='p2'){t.pen=t.pen===2?null:2;playEvt('p2')}
  else if(a==='dnf'){t.pen=t.pen==='dnf'?null:'dnf';playEvt('dnf')}
  else if(a==='del'){S.times.splice(S.times.indexOf(t),1);toast('Solve deleted',1)}
  refresh();
}
const inUI=t=>t.closest&&t.closest('button,select,input,textarea,label,#scr,.sheet,#veil,.dlg,#toast,.pv');
document.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button>0)return;
  if(st!=='running'&&inUI(e.target))return;
  if(bgEl&&bgEl.tagName==='VIDEO'&&bgEl.paused)bgEl.play().catch(()=>{});
  onDown(e);
});
document.addEventListener('pointerup',e=>{if(e.isPrimary)onUp(e)});
document.addEventListener('pointercancel',()=>{clearTimeout(holdT);if(st==='hold')setSt('idle');if(st==='inspHold')setSt('inspect')});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.querySelector('.dlg.on'))closeDlg();else closeSheets();return}
  if(st==='running'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();stop(e.timeStamp);return}
  if(e.code==='Space'&&!document.querySelector('.sheet.on,.dlg.on')){e.preventDefault();if(!e.repeat)onDown(e)}
});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&!document.querySelector('.sheet.on,.dlg.on')){e.preventDefault();onUp(e)}});

/* ---------- sheets ---------- */
function openSheet(id){closeSheets();$(id).classList.add('on');$('#veil').classList.add('on')}
function closeSheets(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));$('#veil').classList.remove('on')}
$('#bh').onclick=()=>{renderHist();openSheet('#sh-h')};
$('#bs').onclick=()=>openSheet('#sh-s');
$('#veil').onclick=closeSheets;
$('#scr').onclick=newScramble;
$('#evsel').onchange=e=>{S.set.ev=e.target.value;newScramble();refresh()};
$('#acts').onclick=e=>{const a=e.target.dataset.a;if(a)rowAct(lastSolve(),a)};
$('#hl').onclick=e=>{const b=e.target.closest('button[data-a]'),li=e.target.closest('li');if(b&&li)rowAct(S.times[+li.dataset.i],b.dataset.a)};
let armed=0;
$('#clr').onclick=e=>{
  if(!armed){armed=1;e.target.textContent='Tap again to clear';setTimeout(()=>{armed=0;e.target.textContent='Clear all'},3000);return}
  const L=list();S.times=S.times.filter(t=>!L.includes(t));armed=0;e.target.textContent='Clear all';refresh();
};

/* ---------- settings ---------- */
const FIT=[['cover','Cover'],['contain','Contain'],['fill','Stretch'],['none','Original size']];
const ITEMS=[
 {g:'More'},{t:'kbd'},{t:'note'},{g:'Timer'},
 {k:'dec',l:'Decimals',t:'sel',o:[[2,'2'],[3,'3']]},
 {k:'hold',l:'Hold time',t:'rng',min:0,max:1000,step:50,u:' ms'},
 {k:'fs',l:'Timer size',t:'rng',min:40,max:140,step:5,u:'%'},
 {k:'col',l:'Timer color',t:'col'},
 {k:'insp',l:'Inspection',t:'chk'},
 {k:'insl',l:'Inspection length',t:'rng',min:3,max:30,step:1,u:' s'},
 {k:'live',l:'Show time while solving',t:'chk'},
 {k:'cfm',l:'Confirm before deleting solves',t:'chk'},
 {g:'Background'},
 {t:'bgs'},
 {k:'bg',l:'Add image, GIF or video',t:'file',acc:'image/*,video/*'},
 {t:'adjb'},
 {k:'amb',l:'Blurred fill behind the image',t:'chk'},
 {k:'scr',l:'Timer legibility shade',t:'rng',min:0,max:100,step:1,u:'%'},
 {k:'fit',l:'Display mode',t:'sel',o:FIT},
 {k:'zoom',l:'Zoom',t:'rng',min:10,max:800,step:5,u:'%'},
 {k:'x',l:'Horizontal position',t:'rng',min:-150,max:150,step:1,u:'%'},
 {k:'y',l:'Vertical position',t:'rng',min:-150,max:150,step:1,u:'%'},

function statHTML(){
  const c=achCtx(),F=funCtx(),cards=[['Solves',c.nOK],['Time solving',c.hrs>=1?c.hrs.toFixed(1)+' h':Math.round(c.hrs*60)+' min'],['Active days',c.nd],['Current streak',c.cur+' d'],['Longest streak',c.lg+' d'],['PB singles',c.pbs],['Best day',c.maxDay],['DNFs',c.dnf]];
  const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],mx=a=>a.indexOf(Math.max(...a)),has=F.tot>0;
  const mins=c.hrs*60,hh=h=>(h%12||12)+(h<12?' am':' pm'),opener=Object.entries(F.first).sort((a,b)=>b[1]-a[1])[0];
  const fun=[
    ['Time on the cube',mins>=60?c.hrs.toFixed(1)+' h':Math.round(mins)+' min',has?`about ${(mins/22).toFixed(1)} sitcom episodes`:'Start solving'],
    ['Scramble moves',F.mv.toLocaleString(),opener?`favorite opener: ${opener[0]} (${opener[1]}x)`:'turned just to mix it up'],
    ['Lucky solves',F.pal+F.rep,`${F.pal} palindromes like 12.21, ${F.rep} repeating like 11.11`],
    ['Hot streak',F.hb,'solves in a row at or under your median'],
    ['Clean streak',F.ndb,'solves in a row without a DNF'],
    ['Improvement',F.imp==null?'\u2013':(F.imp>=0?'-':'+')+Math.abs(F.imp*100).toFixed(1)+'%',F.imp==null?'needs 100 solves in one category':'first 50 solves vs your latest 50'],
    ['Consistency',F.sd==null?'\u2013':'\u00b1'+(F.sd/1000).toFixed(2)+'s',F.sd==null?'needs 5 solves':'spread of your last 100'],
    ['Best Ao5 ever',F.b5==null?'\u2013':fmt(F.b5),F.cat?`in ${F.cat.name}, rolling through history`:''],
    ['Best Ao12 ever',F.b12==null?'\u2013':fmt(F.b12),F.cat?`in ${F.cat.name}, rolling through history`:''],
    ['Favorite day',has?DN[mx(F.wd)]:'\u2013',has?`${Math.max(...F.wd)} solves`:''],
    ['Favorite hour',has?hh(mx(F.hr)):'\u2013',has?`${Math.max(...F.hr)} solves`:''],
    ['Median solve',F.med==null?'\u2013':fmt(F.med),'the middle of all your times'],
    ['Fastest solve',F.fast?fmt(val(F.fast)):'\u2013',F.fast&&F.fast.d?new Date(F.fast.d).toLocaleDateString():''],
    ['Slowest solve',F.slow?fmt(val(F.slow)):'\u2013',F.slow&&F.slow.d?new Date(F.slow.d).toLocaleDateString():''],
    ['Penalties',F.p2+c.dnf,`${F.p2} x +2, ${c.dnf} DNF${F.tot?` (${(c.dnf/F.tot*100).toFixed(1)}% DNF rate)`:''}`],
    ['Per active day',c.nd?(F.tot/c.nd).toFixed(1):'\u2013','solves on the days you solve']
  ];
  const bars=(arr,labs)=>{const m=Math.max(1,...arr);return `<div class='bars'>${arr.map((n,i)=>`<div style='height:${Math.max(3,n/m*100)}%' title='${labs[i]}: ${n}'></div>`).join('')}</div>`};
  const rows=S.cats.map(k=>{const p=c.per[k.id]||{},pb=S.pb[k.id]||{};return `<tr><td>${esc(k.name)}</td><td>${p.n||0}</td><td>${fmt(p.best<Infinity?p.best:null)}</td><td>${fmt(pb.ao5)}</td><td>${fmt(pb.ao12)}</td><td>${fmt(p.mean)}</td></tr>`}).join('');
  const total=Math.max(1,S.cats.reduce((n,k)=>n+((c.per[k.id]||{}).n||0),0)),share=S.cats.filter(k=>(c.per[k.id]||{}).n).map(k=>{const n=c.per[k.id].n;return `<div class='tl'><span>${esc(k.name)}</span><small class='md'>${n} \u00b7 ${Math.round(n/total*100)}%</small></div><div class='pbar' style='margin:0 0 6px'><i style='width:${n/total*100}%'></i></div>`}).join('');
  const wd=new Date().getDay(),start=c.today-wd-7*17,ac=S.profile.accent||'#a9bcff';let hm='';
  for(let i=0;i<126;i++){const d=start+i,n=c.days[d]||0,a=d>c.today?0:n?[.3,.5,.75,1][n>=30?3:n>=15?2:n>=5?1:0]:.07;hm+=`<i style='background:${d>c.today?'transparent':n?ac:'rgba(255,255,255,.06)'};${n?'opacity:'+a:''}' title='${n} solves'></i>`}
  const tl=c.pbev.slice(-8).reverse().map(e=>`<div class='tl'><span>${esc(catOf(e.ev).name)}</span><b>${fmt(e.ms)}</b><small class='md'>${e.d?new Date(e.d).toLocaleDateString():''}</small></div>`).join('');
  const hist=F.hist.length?`<h3>Your time spread \u00b7 ${esc(F.cat.name)}</h3>${bars(F.hist.map(x=>x.n),F.hist.map(x=>fmt(x.lo)))}<div class='bl'><span style='text-align:left'>${fmt(F.hist[0].lo)}</span><span style='text-align:right'>${fmt(F.hist[9].lo)}</span></div>`:'';
  return `<div class='sg'>${cards.map(([l,v])=>`<div><b>${v}</b><small>${l}</small></div>`).join('')}</div><h3>Fun facts</h3><div class='sg'>${fun.map(([l,v,s])=>`<div><small>${l}</small><b>${v}</b><small>${esc(s)}</small></div>`).join('')}</div><h3>Solves by weekday</h3>${bars(F.wd,DN)}<div class='bl'>${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div><h3>Solves by hour</h3>${bars(F.hr,F.hr.map((x,i)=>hh(i)))}<div class='bl'>${F.hr.map((x,i)=>`<span>${i%6===0?hh(i):''}</span>`).join('')}</div>${hist}<h3>Share by category</h3>${share||`<p class='empty'>No solves yet.</p>`}<h3>By category</h3><div style='overflow-x:auto'><table class='tbl'><tr><th>Category</th><th>Solves</th><th>Best</th><th>Ao5 PB</th><th>Ao12 PB</th><th>Mean 100</th></tr>${rows}</table></div><h3>Activity, last 18 weeks</h3><div class='heat'>${hm}</div><h3>Recent personal bests</h3>${tl||`<p class='empty'>Beat your best time to start your PB timeline.</p>`}`;
}
function renderAch(){$('#acx').innerHTML=acTab==='a'?achHTML():statHTML();document.querySelectorAll('#act button').forEach(b=>b.classList.toggle('on',b.dataset.t===acTab))}
function openAch(tab){acTab=tab||'a';renderAch();openSheet('#sh-ac')}
$('#act').onclick=e=>{const t=e.target.dataset.t;if(t){acTab=t;renderAch()}};
$('#acx').onclick=e=>{
  const c=e.target.closest('[data-c]');if(c){acCat=c.dataset.c;renderAch();return}
  const b=e.target.closest('[data-pin]');if(!b||b.disabled)return;
  const p=S.profile,pin=p.pin||(p.pin=[]),id=b.dataset.pin,i=pin.indexOf(id);
  if(i>=0){pin.splice(i,1);toast('Removed from your profile')}else if(pin.length>=3){toast('You can pin up to 3 achievements');return}else{pin.push(id);toast('Pinned to your profile')}
  save();renderAch();
};
const _rp3=renderP;
renderP=function(){_rp3();try{achInject()}catch(e){}};
function achInject(){
  const pc=$('#pc'),ctx=achCtx(),au=S.profile.au||{},T=achTotals(ctx,au),pin=S.profile.pin||[],AFs=getAF();
  const show=pin.map(id=>{const f=AFs.find(x=>x.id===id);if(!f)return'';let got=0;f.tiers.forEach((t,i)=>{if(au[f.id+':'+i])got=i+1});return got?`<span>${medal(f,got,30)}${esc(f.n)}</span>`:''}).join('');
  const first=pc.querySelector('.bd,.pg,h3');
  if(show&&first)first.insertAdjacentHTML('beforebegin',`<div class='show'>${show}</div>`);
  const recent=Object.entries(au).filter(([k,t])=>t>1).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>{const [id,i]=k.split(':'),f=AFs.find(x=>x.id===id);return f?`<span>${medal(f,+i+1,30)}${esc(f.n)}</span>`:''}).join('');
  const acct=[...pc.querySelectorAll('h3')].find(x=>x.textContent==='Account');
  if(acct)acct.insertAdjacentHTML('beforebegin',`<h3>Achievements</h3><div class='lvl'>${lvlBadge(T.lv,48)}<div><b>Level ${T.lv}</b><br><small class='md'>${T.u} of ${T.tot} unlocked \u00b7 ${T.pts} points</small></div><button class='btn' data-p='ach' style='margin-left:auto'>View all</button></div><div class='pbar'><i style='width:${T.pct}%'></i></div>${recent?`<div class='show'>${recent}</div>`:''}<div class='ft' style='margin-top:10px'><button class='btn' data-p='stt'>Full statistics</button></div>`);
}
$('#pc').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;if(b.dataset.p==='ach')openAch('a');else if(b.dataset.p==='stt')openAch('s')});
achSoon();

</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
