name: Unzip Aurel
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o "*.zip"
          rm -f ./*.zip
          if [ -d aurel-pwa ]; then
            cp -r aurel-pwa/. .
            rm -rf aurel-pwa
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack Aurel" || exit 0
          git push
